
openapi: 3.0.3

info:
  title: Sample User API
  version: 1.0.0

servers:
  - url: https://jsonplaceholder.typicode.com

paths:
  /users:
    get:
      summary: Retrieve all users
      responses:
        "200":
          description: Successful response

  /users/{id}:
    get:
      summary: Retrieve a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: User found
        "404":
          description: User not found
